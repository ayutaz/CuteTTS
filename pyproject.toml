[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutetts"
version = "0.1.0"
description = "CuteTTS-jp: Japanese continual training for CuteTTS"
readme = "README.md"
# 3.12 に固定する。torch 2.5.1 の対応は 3.9〜3.12 で、">=3.10" では
# 3.13 / 3.14 を許してしまい実態と合わない（システム既定の3.14では動かない）。
# 検証しているのは 3.12 だけなので、そこへ揃える。
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "LICENSES/*.txt",
]
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.26",
  "loguru>=0.7,<1",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.18,<1",
  "safetensors>=0.4.5,<1",
  "sentencepiece>=0.2,<1",
  "soundfile>=0.12,<1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "tqdm>=4.66,<5",
  "transformers==4.51.0",
  "triton-windows>=3.8,<4 ; sys_platform == 'win32'",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pyyaml>=6,<7",
]
# 日本語継続学習の読み付与（J3 / D-035）。**upstreamの推論には不要**なので
# core の dependencies には入れない。`pip install -e .[ja]` で入る。
#
# pyopenjtalk-plus を選んだ理由（実測。D-035 と 08章 J3 に詳細）:
#   - 読み 12/14。fugashi+unidic-lite と SudachiPy は 10/14、janome は 8/14
#   - 記号を壊さない。SudachiPy は `――` を `きごうきごう` にする
#   - 表記ではなく**発音形**を返す（今日→キョー、中華→チューカ）
#   - アクセント情報（full-context label）も取れる
#   - MIT + 辞書はNAISTのBSD系。Windows wheel があり**ビルド不要**
#
# `[onnxruntime]` extra は**入れない**。有効化しても14語すべて結果が同一で、
# 架空の人名（`聖`→キヨシ）も直らなかった。100MB超を効果ゼロで抱えることになる。
ja = [
  "pyopenjtalk-plus>=0.4,<1",
]
# 抑揚・アクセントの測定（M1 / D-040）。**upstreamの推論には不要**。
# `pip install -e ".[prosody]"` で入る。アクセント側は `[ja]` も要る。
#
# pyworld を選んだ理由（実測。D-040 と 07章 M1 に詳細）:
#   - 調波20本のパルス列で 90〜500Hz を**誤差0.01%**で当てる
#   - **無声/無音を判定する**（無音 0/101、白色雑音 1/101 フレーム）
#   - 依存は numpy だけ。Windows wheel があり**ビルド不要**（約1MB）
#
# `torchaudio.functional.detect_pitch_frequency` は**使えない**。
# 有声/無声を判定せず全フレームを有声として返すので、無音区間のゴミが
# 混ざって3秒の発話で32半音という値になる。
# `librosa`（pyin）は scipy + numba + llvmlite を引く（約200MB）。
prosody = [
  "pyworld>=0.3,<1",
  # **pyworld の sdist は `pkg_resources` を無条件に import する。**
  # linux / macOS には wheel が無いので sdist をビルドし、ここに当たる。
  # `pkg_resources` が同梱されているのは setuptools 81 までで、82 以降では
  # `import pyworld` が ModuleNotFoundError で落ちる（2026-09-26、CIで発覚。R-063）。
  # **Windows の wheel だけは新しい `__init__.py`**（`importlib.metadata` を使う）
  # を持っているので、手元では気づけなかった。
  # **marker を付けず全platformで揃える** — 揃えないと同じ食い違いが
  # また「手元だけ通る」形で隠れる。
  "setuptools<82",
]
# CER評価（`evaluate_japanese_cer.py`）。ASRに kotoba-whisper を使う。
# **`accelerate` が無いと `transformers` のモデル読み込みが
# `NameError: init_empty_weights` で落ちる**（vast.aiの素の環境で実測。
# ローカルには偶然入っていたので気づけなかった）。
eval = [
  "transformers>=4.44,<5",
  "accelerate>=0.30",
  "soundfile>=0.12",
]

# ---------------------------------------------------------------- uv
# **torch は PyPI ではなく PyTorch の cu121 index から取る。**
# ここを宣言しないと `uv sync` が PyPI の CPU 版で上書きしてしまい、
# 別途 cu121 を入れておく → `--no-sync` を付け続ける、という運用になる。
# 宣言しておけば `uv sync` だけで cu121 が入る。
#
# macOS には cu121 の wheel が無いので PyPI へ落とす（MPS 版が入る）。
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
# **explicit = true が要る。** 外すと他の依存までこの index から探しに行く
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.scripts]
cutetts = "cutetts.cli:main"
cutetts-demo = "cutetts.web_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutetts = ["demo/static/*"]

[tool.setuptools.data-files]
"share/cutetts" = ["assets/default_reference.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not gpu'"
markers = [
  "slow: 実checkpointを要する重いテスト",
  "gpu: CUDAを要するテスト。既定では実行しない（ローカルGPUを勝手に使わないため）。実行は -m gpu を明示する。通常は vast.ai 上で走らせる",
]
